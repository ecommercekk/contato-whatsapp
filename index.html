<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conectando ao Atendimento...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f7f9fa;
      color: #333;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .loader {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #25D366;
      border-radius: 50%;
      width: 48px;
      height: 48px;
      animation: spin 0.8s linear infinite;
      margin-bottom: 24px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    h2 {
      font-size: 1.15rem;
      font-weight: 600;
      margin: 0 0 10px 0;
    }
    p {
      font-size: 0.95rem;
      color: #666;
      margin: 0;
    }
    .btn-manual {
      display: inline-block;
      margin-top: 18px;
      padding: 12px 24px;
      background-color: #25D366;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      border-radius: 25px;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <div class="loader"></div>
  <h2>Conectando com nossa consultora...</h2>
  <p>Você será redirecionado para o WhatsApp em instantes.</p>
  <a id="btnManual" class="btn-manual" href="#">Clique aqui para abrir o WhatsApp</a>

  <script>
    (function() {
      // 1. DADOS DE ATENDIMENTO
      var vendedoraNome = "Valeria";
      var vendedoraFone = "5511971483931";

      // 2. URL DO WEBHOOK DO GOOGLE APPS SCRIPT
      var urlAppsScript = "https://script.google.com/macros/s/AKfycbyzON6m8odwUU947Mx1gUyiyaenLMmr_BwCz7M3uyWpNsBxECZepOIab07W24bWhDEj1g/exec";

      // 3. MENSAGEM PADRONIZADA (Código M-26 identifica origem Meta Ads de forma discreta)
      var textoMensagem = "Olá! Acabei de solicitar o Catálogo Digital (Ref: M-26) pelo anúncio e gostaria de tirar dúvidas sobre o projeto.";
      var linkWhatsApp = "https://api.whatsapp.com/send?phone=" + vendedoraFone + "&text=" + encodeURIComponent(textoMensagem);

      // 4. ATRIBUIÇÃO AO BOTÃO MANUAL
      var btn = document.getElementById("btnManual");
      if (btn) {
        btn.href = linkWhatsApp;
      }

      // 5. REGISTRO NA PLANILHA COM A ORIGEM
      try {
        if (urlAppsScript) {
          var pingUrl = urlAppsScript + "?vendedora=" + encodeURIComponent(vendedoraNome) + "&origem=MetaAds";
          if (navigator.sendBeacon) {
            navigator.sendBeacon(pingUrl);
          } else {
            new Image().src = pingUrl;
          }
        }
      } catch (e) {}

      // 6. REDIRECIONAMENTO AUTOMÁTICO
      setTimeout(function() {
        window.location.href = linkWhatsApp;
      }, 500);
    })();
  </script>

</body>
</html>
